org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# On Windows, Kotlin incremental compilation can fail when sources live on a
# different drive letter than the project (e.g., Pub cache on C: and project on D:).
# Disable it to make release builds reliable.
kotlin.incremental=false
