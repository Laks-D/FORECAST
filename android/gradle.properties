org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
# Force Gradle to use a supported *full* JDK (must include `jmods`).
# Android Studio's bundled JBR may not ship `jmods`, which can break AGP's
# androidJdkImage transform with "provider has no value".
# org.gradle.java.home=/Applications/Android Studio.app/Contents/jbr/Contents/Home
android.useAndroidX=true
android.enableJetifier=true

# On Windows, Kotlin incremental compilation can fail when sources live on a
# different drive letter than the project (e.g., Pub cache on C: and project on D:).
# Disable it to make release builds reliable.
kotlin.incremental=false
