name: snow
description: Modular Flutter app scaffold.
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  bloc: ^8.1.4
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5
  get_it: ^7.6.0
  google_fonts: ^6.2.1
  flex_color_picker: ^3.7.0
  shared_preferences: ^2.2.3
  image_picker: ^1.1.2
  flutter_local_notifications: ^20.1.0
  timezone: ^0.10.1
  flutter_timezone: ^1.0.8
  firebase_core: ^4.6.0
  firebase_auth: ^6.3.0
  cloud_firestore: ^6.2.0
  firebase_messaging: ^16.1.3
  google_sign_in: ^7.2.0
  flutter_slidable: ^3.1.2
  flutter_riverpod: ^2.6.1
  share_plus: ^7.2.1
  qr_flutter: ^4.0.0
  mobile_scanner: ^3.0.0
  app_links: ^6.4.0   # handles Android App Links & iOS Universal Links
  # uni_links removed (unused) — prevents Android build issues with older plugin variants

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
